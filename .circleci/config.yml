version: 2.1

jobs:
  starter-package:
    docker:
      - image: cimg/node:24.11
    working_directory: ~/project
    environment:
      NEXT_PUBLIC_SITE_URL: https://your-starter.example.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLIC_KEY: ci_supabase_public_key
      SUPABASE_SECRET_KEY: ci_supabase_secret_key
      BABYSEA_API_KEY: ci_babysea_api_key
      BABYSEA_API_BASE_URL: https://api.us.babysea.live
      STRIPE_SECRET_KEY: ci_stripe_secret_key
      STRIPE_WEBHOOK_SECRET: ci_stripe_webhook_secret
      STRIPE_PRICE_STARTER: ci
      STRIPE_PRICE_BUILDER: ci
      STRIPE_PRICE_PRODUCTION: ci
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci_upstash_redis_rest_token
      NEXT_PUBLIC_SENTRY_DSN: https://example.sentry.io
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci
      SENTRY_ORG: ci
      SENTRY_PROJECT: ci
      SENTRY_AUTH_TOKEN: ci_sentry_auth_token
    steps:
      - checkout
      - restore_cache:
          keys:
            - generative-media-starter-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Set up pnpm
          command: |
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            npm install --global --prefix "$HOME/.local" pnpm@10.19.0
            pnpm config set store-dir ~/.pnpm-store
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: generative-media-starter-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: Format check
          command: pnpm format
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Typecheck
          command: pnpm typecheck
      - run:
          name: Test coverage
          command: pnpm test:coverage
      - persist_to_workspace:
          root: .
          paths:
            - coverage/lcov.info
      - run:
          name: Build
          command: pnpm build

  dependency-audit:
    docker:
      - image: cimg/node:24.11
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - generative-media-starter-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Set up pnpm
          command: |
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            npm install --global --prefix "$HOME/.local" pnpm@10.19.0
            pnpm config set store-dir ~/.pnpm-store
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: generative-media-starter-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: pnpm audit production high+
          command: pnpm audit --prod --audit-level=high

  codecov-upload:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Upload coverage to Codecov
          command: |
            if [ -z "${CODECOV_TOKEN:-}" ]; then
              echo "CODECOV_TOKEN is not configured in CircleCI; skipping trusted main coverage upload."
              exit 0
            fi
            curl -fsSLO https://cli.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov --auto-load-params-from CircleCI upload-process \
              -Z \
              -t "$CODECOV_TOKEN" \
              -C "$CIRCLE_SHA1" \
              -f coverage/lcov.info \
              --disable-search

workflows:
  package-check:
    jobs:
      - starter-package
      - dependency-audit
      - codecov-upload:
          requires:
            - starter-package
          filters:
            branches:
              only: main
