services:
  - type: web
    name: generative-media-starter
    runtime: node
    autoDeploy: false
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLIC_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: BABYSEA_API_KEY
        sync: false
      - key: BABYSEA_API_BASE_URL
        value: https://api.us.babysea.ai
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
