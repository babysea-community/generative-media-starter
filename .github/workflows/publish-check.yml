name: Package Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  starter:
    name: generative-media-starter package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://generative-media-starter.example.com
      BABYSEA_API_KEY: ci
      STRIPE_SECRET_KEY: ci
      STRIPE_WEBHOOK_SECRET: ci
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLIC_KEY: ci
      SUPABASE_SECRET_KEY: ci
      UPSTASH_REDIS_REST_URL: https://ci.example.com
      UPSTASH_REDIS_REST_TOKEN: ci
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Upload coverage reports to Codecov
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          disable_search: true
      - run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Fail on high/critical CVEs in production dependencies. Dev-only CVEs
      # are surfaced by Dependabot; gating CI on them creates noise without
      # production impact.
      - name: pnpm audit (production, high+)
        run: pnpm audit --prod --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          GITLEAKS_VERSION: 8.28.0
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner --redact
