name: Snyk Security

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk security
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      NEXT_PUBLIC_SITE_URL: https://generative-media-starter.example.com
      BABYSEA_API_KEY: ci
      STRIPE_SECRET_KEY: ci
      STRIPE_WEBHOOK_SECRET: ci
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLIC_KEY: ci
      SUPABASE_SECRET_KEY: ci
      UPSTASH_REDIS_REST_URL: https://ci.example.com
      UPSTASH_REDIS_REST_TOKEN: ci
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Snyk CLI to check for security issues
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      - name: Snyk Code test
        run: snyk code test --sarif > snyk-code.sarif || true

      - name: Upload Snyk Code result to GitHub Code Scanning
        if: ${{ always() && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif

      - name: Snyk Open Source monitor
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: snyk monitor --all-projects

      - name: Snyk IaC test and report
        run: snyk iac test --report || true

      - name: Snyk Open Source test
        run: snyk test --all-projects --severity-threshold=high
